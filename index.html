
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UCL LIVE | Champions League</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #070f2b;
  color: white;
}

header {
  background: linear-gradient(135deg,#101d50,#172c70);
  padding: 25px 15px;
  text-align: center;
  border-bottom: 2px solid #e4c46a;
}

header h1 {
  color: #f5d77b;
  font-size: 32px;
  margin: 0;
}

header p {
  color: #cbd5f0;
}

.container {
  max-width: 850px;
  margin: auto;
  padding: 20px;
}

.section-title {
  color: #f5d77b;
  margin-bottom: 18px;
}

.match {
  background: #14234b;
  border: 1px solid #344879;
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 15px;
}

.status {
  color: #f5d77b;
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 15px;
}

.teams {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  font-weight: bold;
}

.team {
  flex: 1;
  text-align: center;
}

.score {
  color: #f5d77b;
  font-size: 25px;
  white-space: nowrap;
}

.match-info {
  text-align: center;
  color: #aebcdb;
  font-size: 12px;
  margin-top: 15px;
}

button {
  background: #f5d77b;
  color: #101a3d;
  border: none;
  border-radius: 7px;
  padding: 12px 18px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #ffe69b;
}

.message {
  text-align: center;
  color: #cbd5f0;
  padding: 25px 10px;
}

.updated {
  color: #9eafd2;
  font-size: 12px;
  margin-top: 15px;
}

footer {
  text-align: center;
  color: #8999bd;
  padding: 25px;
  font-size: 12px;
}
</style>
</head>

<body>

<header>
  <h1>⭐ UCL LIVE</h1>
  <p>UEFA Champions League Match Centre</p>
</header>

<main class="container">

  <h2 class="section-title">⚽ Match Centre</h2>

  <div id="matches">
    <p class="message">Loading matches...</p>
  </div>

  <button onclick="loadMatches()">↻ Refresh Scores</button>

  <p class="updated" id="updated">
    Waiting for match data...
  </p>

</main>

<footer>
  UCL LIVE • All about Champions League football
</footer>

<script>

// ======================================
// API SETTINGS
// ======================================

// Insert your football-data.org API token here.
// WARNING: This token will be visible in a public repository.

const API_TOKEN = "450acb00cf27c92f1c3b6eb6998b3dad";

const API_URL =
  "https://api.football-data.org/v4/competitions/CL/matches";

// ======================================
// LOAD CHAMPIONS LEAGUE MATCHES
// ======================================

async function loadMatches() {

  const matchContainer =
    document.getElementById("matches");

  matchContainer.innerHTML =
    '<p class="message">Loading Champions League matches...</p>';

  try {

    const response = await fetch(API_URL, {
      headers: {
        "X-Auth-Token": API_TOKEN
      }
    });

    if (!response.ok) {
      throw new Error("API error: " + response.status);
    }

    const data = await response.json();

    const matches = data.matches || [];

    if (matches.length === 0) {
      matchContainer.innerHTML =
        '<p class="message">No matches available.</p>';
      return;
    }

    matchContainer.innerHTML = "";

    matches.forEach(match => {

      const homeTeam =
        match.homeTeam?.name || "Home Team";

      const awayTeam =
        match.awayTeam?.name || "Away Team";

      const homeScore =
        match.score?.fullTime?.home;

      const awayScore =
        match.score?.fullTime?.away;

      let score = "VS";

      if (
        homeScore !== null &&
        homeScore !== undefined &&
        awayScore !== null &&
        awayScore !== undefined
      ) {
        score = homeScore + " - " + awayScore;
      }

      const status = match.status || "SCHEDULED";

      const kickoff = match.utcDate
        ? new Date(match.utcDate).toLocaleString()
        : "Time unavailable";

      const card = document.createElement("div");
      card.className = "match";

      const statusElement = document.createElement("div");
      statusElement.className = "status";
      statusElement.textContent = status;

      const teams = document.createElement("div");
      teams.className = "teams";

      const home = document.createElement("div");
      home.className = "team";
      home.textContent = homeTeam;

      const scoreElement = document.createElement("div");
      scoreElement.className = "score";
      scoreElement.textContent = score;

      const away = document.createElement("div");
      away.className = "team";
      away.textContent = awayTeam;

      teams.append(home, scoreElement, away);

      const info = document.createElement("div");
      info.className = "match-info";
      info.textContent = kickoff;

      card.append(statusElement, teams, info);

      matchContainer.appendChild(card);

    });

    document.getElementById("updated").textContent =
      "Last updated: " + new Date().toLocaleTimeString();

  } catch (error) {

    matchContainer.innerHTML =
      '<p class="message">Unable to load matches. Please check your API token and connection.</p>';

    console.error(error);

    document.getElementById("updated").textContent =
      "Could not update scores.";

  }

}

// Initial loading
loadMatches();

// Refresh every 60 seconds
setInterval(loadMatches, 60000);

</script>

</body>
  </html>
